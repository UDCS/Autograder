server:
  port: 8080

app:
  timezone: America/Chicago

db:
  host: localhost
  port: 5432
  user: postgres
  password: postgres
  dbname: autograder
  sslmode: disable
  # Keep this bounded below Cloud SQL's capacity. Account for every running app instance.
  max_open_conns: 5
  max_idle_conns: 2
  conn_max_lifetime: 30m
  conn_max_idle_time: 5m

auth:
  jwt:
    secret: secret # Change this to a long random string
    access_token_duration: 1h
    refresh_token_duration: 168h
    session_max_duration: 336h
  admins:
  - mharold@udallas.edu
